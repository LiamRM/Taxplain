<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Taxplain favicon
    Concept: a "T" formed by tax-flow streams. The vertical stem is gross
    income (deep blue), the horizontal crossbar splits into a tax band
    (red, peeling off left) and a take-home band (green, continuing right) —
    a miniature flow diagram that doubles as a "T" lockup.
  -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>

  <!-- Crossbar of the T: tax peels off left, kept continues right -->
  <!-- Tax band (red) -->
  <rect x="10" y="14" width="20" height="10" rx="2" fill="#dc2626"/>
  <!-- Kept band (green) -->
  <rect x="34" y="14" width="20" height="10" rx="2" fill="#10b981"/>

  <!-- Vertical stem of the T: gross income flowing down -->
  <rect x="27" y="24" width="10" height="30" rx="2" fill="#3b82f6"/>

  <!-- Subtle connecting curves: ties the bar segments to the stem,
       reinforcing the Sankey-flow metaphor. -->
  <path d="M 30 24 Q 30 19 27 19" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <path d="M 34 24 Q 34 19 37 19" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
